name: TaskHub checks

on:
  push:
    branches: ["main", "fix/**"]
  pull_request:
    branches: ["main"]

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: taskhub_release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install API integration test dependency
        run: pip install httpx==0.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check frontend JavaScript syntax
        run: node --check app/static/app.js
      - name: Compile Python modules
        run: python -m compileall -q app
      - name: Run tests
        run: python -m unittest discover -s tests -v
