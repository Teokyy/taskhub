name: TaskHub core checks
on:
  push:
    branches: ["refactor/rooms-core"]
  pull_request:
    branches: ["main"]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install API test dependencies
        run: pip install -r taskhub_release/requirements.txt httpx==0.28.1
      - name: Compile application and migration utilities
        run: python -m py_compile taskhub_release/app/bot.py taskhub_release/app/main.py taskhub_release/app/rooms.py taskhub_release/app/room_task_actions.py taskhub_release/app/task_refusal.py taskhub_release/app/room_budgets.py taskhub_release/scripts/backup_sqlite.py taskhub_release/scripts/migrate_to_rooms.py
      - name: Run migration tests
        run: python -m unittest discover -s taskhub_release/tests -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Check Mini App JavaScript syntax
        run: |
          node --check taskhub_release/app/static/app.js
          node --check taskhub_release/app/static/budget.js
