<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TaskHub</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>:root{color-scheme:dark;--bg:#0e1015;--card:#191d27;--muted:#929bad;--accent:#8978ff;--line:#2b3040}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f5f6fa;font:15px system-ui;padding:18px 16px 94px}.wrap{max-width:620px;margin:auto}.top,.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:23px;font-weight:850}.avatar{background:#5145a8;border-radius:14px;padding:12px}.muted,.label{color:var(--muted)}h1{font-size:23px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:16px;margin:12px 0}.balance{background:linear-gradient(120deg,#282246,#191d27)}.amount{font-size:30px;font-weight:800;margin:6px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .card{margin:0}.btn{background:var(--accent);color:white;border:0;border-radius:12px;padding:11px 14px;font-weight:700;cursor:pointer}.btn.secondary{background:#303548}.btn.danger{background:#803d4d}.btn:disabled{opacity:.45}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:#141720f5;border-top:1px solid var(--line);padding:8px 4px calc(8px + env(safe-area-inset-bottom))}.nav button{background:none;border:0;color:var(--muted);font-size:12px;padding:8px}.nav button.active{color:white}.hidden{display:none}.field{width:100%;background:#10131b;color:white;border:1px solid var(--line);border-radius:10px;padding:12px;margin:6px 0 12px}textarea.field{min-height:90px}.tasktitle{font-weight:750}.tag{color:#c8c0ff;background:#302b4d;border-radius:99px;padding:5px 9px;font-size:12px}.error{color:#ff8d9a}.empty{padding:20px;text-align:center;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}h2{font-size:19px}</style></head><body><div class="wrap"><div class="top"><div class="brand">TaskHub<span style="color:var(--accent)">.</span></div><div id="avatar" class="avatar">T</div></div><main id="view"><div class="empty">Загрузка…</div></main></div><nav class="nav"><button data-tab="home" class="active">⌂ Главная</button><button data-tab="tasks">▤ Задачи</button><button data-tab="mine">◷ Мои</button><button data-tab="balance">₽ Баланс</button><button data-tab="profile">◉ Профиль</button></nav><script src="/static/app.js"></script></body></html>
